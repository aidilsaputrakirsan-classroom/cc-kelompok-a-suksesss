# ============================================================
# Docker Compose — SafeSpace PRODUCTION
# ============================================================
# HANYA GATEWAY YANG DIEKSPOS KE INTERNET!
# Database dan Backend diisolasi di dalam network internal.
# ============================================================

services:
  auth-db:
    image: postgres:16-alpine
    container_name: safespace-auth-db-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:-postgres}
      POSTGRES_DB: auth_db
    # INFO: Blok 'ports' dihapus demi keamanan production
    volumes:
      - auth_pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auth_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  item-db:
    image: postgres:16-alpine
    container_name: safespace-item-db-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${ITEM_DB_PASSWORD:-postgres}
      POSTGRES_DB: item_db
    # INFO: Blok 'ports' dihapus demi keamanan production
    volumes:
      - item_pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d item_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: ./services/auth-service
    container_name: safespace-auth-service-prod
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://postgres:${AUTH_DB_PASSWORD:-postgres}@auth-db:5432/auth_db"
      SECRET_KEY: ${SECRET_KEY}
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      SERVICE_NAME: auth-service
      LOG_LEVEL: INFO
    # INFO: Blok 'ports' dihapus. Akses hanya dari gateway.
    depends_on:
      auth-db:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M

  item-service:
    build:
      context: ./services/item-service
    container_name: safespace-item-service-prod
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://postgres:${ITEM_DB_PASSWORD:-postgres}@item-db:5432/item_db"
      AUTH_SERVICE_URL: http://auth-service:8001
      SERVICE_NAME: item-service
      LOG_LEVEL: INFO
    # INFO: Blok 'ports' dihapus.
    depends_on:
      auth-service:
        condition: service_started
      item-db:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M

  gateway:
    image: nginx:alpine
    container_name: safespace-gateway-prod
    restart: unless-stopped
    ports:
      - "80:80"  # HANYA INI YANG TERBUKA UNTUK PUBLIK (Port 80 standar web)
    volumes:
      - ./services/gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      auth-service:
        condition: service_started
      item-service:
        condition: service_started

volumes:
  auth_pgdata_prod:
  item_pgdata_prod: