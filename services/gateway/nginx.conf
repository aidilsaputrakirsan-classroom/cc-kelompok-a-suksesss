server {
    listen 80;

    # 1. Rute Halaman Utama (Frontend)
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ==========================================
    # 2. Rute AUTH SERVICE
    # ==========================================
    # Menangkap request API (contoh: /auth/api/bk/login -> /api/bk/login)
    location /auth/api/ {
        proxy_pass http://auth-service:8001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    
    # Menangkap request umum (contoh: /auth/health -> /health)
    location /auth/ {
        proxy_pass http://auth-service:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ==========================================
    # 3. Rute ITEM SERVICE
    # ==========================================
    # Menangkap request API (contoh: /items/api/bk/dashboard -> /api/bk/dashboard)
    location /items/api/ {
        proxy_pass http://item-service:8002/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Menangkap request umum (contoh: /items/health -> /health)
    location /items/ {
        proxy_pass http://item-service:8002/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}